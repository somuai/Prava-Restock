name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: Test and build PWA
        working-directory: ui/web
        run: npm ci && npm test && npm run build
      - name: Build production container
        run: docker build -t restock-ci .
      - name: Verify Zepto MCP runtime in production container
        run: >-
          docker run --rm --network none
          --entrypoint /app/scripts/verify_zepto_mcp_runtime.sh
          restock-ci
