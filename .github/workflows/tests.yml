name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            ui/web/package-lock.json
            ui/waitlist/package-lock.json
            ui/waitlist-video/package-lock.json
      - name: Test and build PWA
        working-directory: ui/web
        run: npm ci && npm test && npm run build
      - name: Test and build public waitlist
        working-directory: ui/waitlist
        run: npm ci && npm test && npm run build
      - name: Check Remotion feature film source
        working-directory: ui/waitlist-video
        run: npm ci && npm run check
      - name: Build production container
        run: docker build -t restock-ci .
      - name: Verify Zepto MCP runtime in production container
        run: >-
          docker run --rm --network none
          --entrypoint /app/scripts/verify_zepto_mcp_runtime.sh
          restock-ci
