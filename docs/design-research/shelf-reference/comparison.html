<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restock shelf comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #d9d7d0; font: 14px/1.4 system-ui, sans-serif; color: #23241f; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
      figure { margin: 0; background: white; box-shadow: 0 10px 28px rgba(0, 0, 0, .12); }
      figcaption { padding: 10px 12px; border-bottom: 1px solid #ddd; font-weight: 650; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Selected visual direction</figcaption>
        <img src="03-selected-direction.png" alt="Selected minimal shelf design direction" />
      </figure>
      <figure>
        <figcaption>Browser implementation · 1440 × 1024</figcaption>
        <img src="04-implementation-desktop.png" alt="Restock browser implementation" />
      </figure>
    </main>
  </body>
</html>
