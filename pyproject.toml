[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "restock-agent"
version = "0.1.0"
description = "Consumption-triggered replenishment agent built on Prava"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pytest",
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent*", "common*", "triggers*", "payments*", "merchant*", "ui*", "demo*"]
