[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "restock-agent"
version = "0.1.0"
description = "Consumption-triggered replenishment agent built on Prava"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents==0.18.2",
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "mcp==1.28.1",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "slack-bolt==1.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not integration"'
markers = [
    "integration: calls the real Prava sandbox and requires local credentials",
]

[tool.setuptools.packages.find]
include = ["agent*", "channels*", "common*", "forecasting*", "triggers*", "payments*", "merchant*", "ui*", "demo*", "storage*", "workflow*"]
