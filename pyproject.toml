[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "restock-agent"
version = "0.1.0"
description = "Consumption-triggered replenishment agent built on Prava"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents==0.18.2",
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent*", "common*", "triggers*", "payments*", "merchant*", "ui*", "demo*"]
